.dock{
  position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));

}

  width:100%;border:0;background:var(--accent);color:var(--accent-ink);

  box-shadow:0 6px 20px -8px rgba(0,0,0,.45);

function pad(n){return n<10?"0"+n:""+n;}
/* The grocery month runs from cycleDay of one month to the day before
   cycleDay of the next, and is named after the month it ENDS in.
   cycleDay 1 means plain calendar months. */
function cycleDay(){var d=parseInt(S.cycleDay,10);return (d>=2&&d<=28)?d:1;}
function mkey(dateStr){
  var s=String(dateStr), m=s.slice(0,7), cd=cycleDay();
  if(cd===1)return m;
  var day=parseInt(s.slice(8,10),10)||1;
  return day>=cd?shiftMonth(m,1):m;
}
function periodRange(k){
  var cd=cycleDay();
  if(cd===1){
    var last=new Date(parseInt(k.slice(0,4),10),parseInt(k.slice(5,7),10),0).getDate();
    return {start:k+"-01",end:k+"-"+pad(last)};
  }
  return {start:shiftMonth(k,-1)+"-"+pad(cd),end:k+"-"+pad(cd-1)};
}
function dm(ds){var p=ds.split("-");return (+p[2])+" "+MONTHS[+p[1]-1].slice(0,3);}
function rangeLabel(k){var r=periodRange(k);return dm(r.start)+" – "+dm(r.end);}
function mlabel(k){var p=k.split("-");return MONTHS[parseInt(p[1],10)-1]+" "+p[0];}
function mshort(k){var p=k.split("-");return MONTHS[parseInt(p[1],10)-1].slice(0,3)+" "+p[0];}
function shiftMonth(k,d){
  var y=parseInt(k.slice(0,4),10), m=parseInt(k.slice(5,7),10)-1+d;
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  return y+"-"+pad(m+1);
}
function dayLabel(ds){
  var p=ds.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]);
  var wd=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
  if(ds===today())return "Today · "+wd+" "+(+p[2])+" "+MONTHS[+p[1]-1].slice(0,3);
  return wd+" "+(+p[2])+" "+MONTHS[+p[1]-1].slice(0,3);
}
function shortDate(ds){
  if(ds===today())return "today";
  var p=String(ds).split("-");
  if(p.length<3)return ds;
  return (+p[2])+" "+MONTHS[+p[1]-1].slice(0,3)+(p[0]===today().slice(0,4)?"":" "+p[0]);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function parseAmt(v){
  v=String(v).replace(/[^0-9.,-]/g,"").replace(/\s/g,"");
  if(v.indexOf(",")>-1&&v.indexOf(".")===-1)v=v.replace(",",".");
  else v=v.replace(/,/g,"");
  var n=parseFloat(v); return isFinite(n)?n:NaN;
}

/* ---------- state ---------- */
function loadState(){
  var raw=document.getElementById("app-state").textContent;
  try{S=JSON.parse(raw);}catch(e){S=null;}
  if(!S||typeof S!=="object")S={};
  if(!S.cur)S.cur="R";
  if(!S.names)S.names={W:"Wikus",R:"Rochell"};
  if(typeof S.splitW!=="number")S.splitW=65;
  if(typeof S.budget!=="number")S.budget=0;
  if(typeof S.cycleDay!=="number"||S.cycleDay<1||S.cycleDay>28)S.cycleDay=1;
  if(!Array.isArray(S.cats))S.cats=["Groceries","Household","Toiletries","Pets","Takeaways","Other"];
  if(!Array.isArray(S.entries))S.entries=[];
  if(!Array.isArray(S.deleted))S.deleted=[];
  if(!S.settled)S.settled={};
  try{var p=JSON.parse(localStorage.getItem(LS_PENDING)||"null");
      if(p&&p.add&&p.del)pending=p;}catch(e){}
  try{var m=localStorage.getItem(LS_ME); if(m==="W"||m==="R")me=m;}catch(e){}
  mergeMirror();
  mergePending();
}
/* This phone keeps its own full copy of the ledger. If the page ever comes
   back with an older ledger than this phone has seen, the missing hauls are
   put back here and saved again. The page always wins on hauls it already
   holds, and anything deleted stays deleted. */
function mergeMirror(){
  var mir=null;
  try{mir=JSON.parse(localStorage.getItem(LS_MIRROR)||"null");}catch(e){}
  if(!mir||!Array.isArray(mir.entries))return;
  var i;
  if(PHONE_WINS&&mir.settings&&typeof mir.settings==="object")
    for(i=0;i<SETTING_KEYS.length;i++)
      if(mir.settings[SETTING_KEYS[i]]!==undefined)S[SETTING_KEYS[i]]=mir.settings[SETTING_KEYS[i]];
  if(Array.isArray(mir.deleted))
    for(i=0;i<mir.deleted.length;i++)
      if(S.deleted.indexOf(mir.deleted[i])===-1)S.deleted.push(mir.deleted[i]);
  var del={},have={};
  for(i=0;i<S.deleted.length;i++)del[S.deleted[i]]=1;
  for(i=0;i<S.entries.length;i++)have[S.entries[i].id]=1;
  for(i=0;i<mir.entries.length;i++){
    var e=mir.entries[i];
    if(!e||!e.id||del[e.id])continue;
    if(have[e.id]){
      if(PHONE_WINS)for(var q=0;q<S.entries.length;q++)if(S.entries[q].id===e.id){S.entries[q]=e;break;}
      continue;
    }
    S.entries.push(e);have[e.id]=1;restored++;
  }
  S.entries=S.entries.filter(function(x){return !del[x.id];});
}
function saveMirror(){
  try{var st={};for(var i=0;i<SETTING_KEYS.length;i++)st[SETTING_KEYS[i]]=S[SETTING_KEYS[i]];
  localStorage.setItem(LS_MIRROR,JSON.stringify({entries:S.entries,deleted:S.deleted,settings:st}));}catch(e){}
}
function mergePending(){
  var have={},i;
  for(i=0;i<S.entries.length;i++)have[S.entries[i].id]=1;
  var delSet={};
  for(i=0;i<S.deleted.length;i++)delSet[S.deleted[i]]=1;
  for(i=0;i<pending.del.length;i++)delSet[pending.del[i]]=1;
  var keepAdd=[];
  for(i=0;i<pending.add.length;i++){
    var e=pending.add[i];
    if(delSet[e.id])continue;
    if(!have[e.id]){S.entries.push(e);have[e.id]=1;keepAdd.push(e);}
  }
  pending.add=keepAdd;
  var keepDel=[];
  for(i=0;i<pending.del.length;i++){
    var id=pending.del[i];
    if(S.deleted.indexOf(id)===-1)keepDel.push(id);
  }
  pending.del=keepDel;
  S.entries=S.entries.filter(function(e){return !delSet[e.id];});
  for(i=0;i<pending.del.length;i++)if(S.deleted.indexOf(pending.del[i])===-1)S.deleted.push(pending.del[i]);
  savePending();
}
function savePending(){
  try{localStorage.setItem(LS_PENDING,JSON.stringify(pending));}catch(e){}
}
function hasPending(){return pending.add.length>0||pending.del.length>0;}

/* ---------- maths ---------- */
function monthEntries(k){
  return S.entries.filter(function(e){return mkey(e.date)===k;})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);});
}
function summarise(k){
  var es=monthEntries(k), total=0, paid={W:0,R:0}, byCat={};
  for(var i=0;i<es.length;i++){
    var e=es[i], a=+e.amount||0;
    total+=a;
    paid[e.who==="R"?"R":"W"]+=a;
    var c=e.cat||"Other";
    byCat[c]=(byCat[c]||0)+a;
  }
  total=r2(total); paid.W=r2(paid.W); paid.R=r2(paid.R);
  var tw=r2(total*S.splitW/100), tr=r2(total-tw);
  var diff=r2(tw-paid.W);           /* >0 : Wikus underpaid */
  var settle=null;
  if(Math.abs(diff)>=0.005)settle={from:diff>0?"W":"R",to:diff>0?"R":"W",amount:Math.abs(diff)};
  return {k:k,entries:es,total:total,paid:paid,target:{W:tw,R:tr},settle:settle,byCat:byCat,count:es.length};
}
function allMonths(){
  var set={};
  for(var i=0;i<S.entries.length;i++)set[mkey(S.entries[i].date)]=1;
  var ks=Object.keys(set); ks.sort(); ks.reverse();
  return ks;
}

/* ---------- persistence ---------- */
function commit(opts){
  saveMirror();
  render();
  if(mode==="local"){syncState="local";paintSync();return;}
  clearTimeout(pubTimer);
  syncState="busy";paintSync();
  pubTimer=setTimeout(publishNow,(opts&&opts.now)?150:900);
}
function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  var src=document.getElementById("app-src").textContent;
  var boot=document.getElementById("boot").textContent;
  var S1="<scr"+"ipt", E1="</scr"+"ipt>";
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+
    '<title>Split the Trolley</title>'+FONT_HEAD+'</head><body>'+
    S1+' id="app-state" type="application/json">'+json+E1+
    S1+' id="app-src" type="text/plain">'+src+E1+
    '<div id="root"></div>'+
    S1+' id="boot">'+boot+E1+
    '</body></html>';
}
function publishNow(){
  if(!api){                                  /* capability still resolving */
    if(waited<14){waited++;clearTimeout(pubTimer);pubTimer=setTimeout(publishNow,1000);return;}
    mode="local";syncState="local";paintSync();render();return;
  }
  if(!api.publish){mode="local";syncState="local";paintSync();return;}
  try{sessionStorage.setItem(SS_UI,JSON.stringify({tab:ui.tab,month:ui.month}));}catch(e){}
  api.publish(buildDoc()).then(function(){
    pending={add:[],del:[]};savePending();
    syncState="saved";paintSync();
  }).catch(function(err){
    var c=(err&&err.code)||"upstream_error";
    if(c==="conflict"){return;}            /* the view reloads to the winner */
    if(c==="rate_limited"){clearTimeout(pubTimer);pubTimer=setTimeout(publishNow,4000);return;}
    if(c==="upstream_error"){clearTimeout(pubTimer);pubTimer=setTimeout(publishNow,2500);return;}
    mode="local";syncState="local";paintSync();render();
  });
}
function paintSync(){
  var el=document.getElementById("syncchip");
  if(!el)return;
  var cls="dot",txt="Saved";
  if(syncState==="busy"){cls="dot busy";txt="Saving…";}
  else if(syncState==="local"){cls="dot local";txt="This phone";}
  el.innerHTML='<span class="'+cls+'"></span>'+esc(txt);
}

       '<textarea id="f-out" class="codebox" readonly rows="4">'+esc(ui.codeOut)+'</textarea>'+
       '<button class="btn" style="margin-top:8px" data-act="copycode">Copy to clipboard</button>':"")+
     '<div class="field" style="margin-top:14px"><label for="f-imp">Paste a code you were sent</label>'+
     '<textarea id="f-imp" placeholder="TROLLEY1:..." aria-label="Import code">'+esc(ui.imp)+'</textarea>'+
     '<div class="btnrow"><button class="btn" data-act="pasteimp">Paste from clipboard</button>'+
     '<button class="btn primary" data-act="import">Import hauls</button></div></div>'+
     '</div>';

  h+='<div class="card"><h3>Backup</h3><p class="hint">Every haul and a month-by-month summary, as a spreadsheet.</p>'+
     '<button class="btn" data-act="csv">Export CSV</button></div>';

  h+='<div class="card"><h3>Danger zone</h3><p class="hint">Deletes every haul stored on this phone. There is no undo — export the CSV first if you want a copy.</p>'+
     '<button class="btn danger" data-act="wipe">'+(ui.confirmWipe?"Tap again to erase everything":"Erase all hauls")+'</button></div>';
  return h;
}

function sheetForm(){
  var f=ui.form;

  for(i=S.entries.length-1;i>=0&&Object.keys(titles).length<8;i--){
    var t=S.entries[i].title; if(t)titles[t]=(titles[t]||0)+1;

    h+='</div>';
  }
  h+='</div>';

  h+='<div class="field"><label>Who paid</label><div class="who-pick">'+
     '<button type="button" class="W" data-act="who" data-who="W" aria-pressed="'+(f.who==="W")+'">'+esc(S.names.W)+'</button>'+
     '<button type="button" class="R" data-act="who" data-who="R" aria-pressed="'+(f.who==="R")+'">'+esc(S.names.R)+'</button></div></div>';
  h+='<div class="field"><label for="i-date">Date</label><input id="i-date" type="date" value="'+esc(f.date)+'"></div>';
  h+='<div class="field"><label for="i-cat">Category</label><select id="i-cat">';
  for(i=0;i<S.cats.length;i++)h+='<option'+(S.cats[i]===f.cat?" selected":"")+'>'+esc(S.cats[i])+'</option>';
  h+='</select></div>';
  h+='<div class="field"><label for="i-note">Note (optional)</label><input id="i-note" type="text" value="'+esc(f.note)+'" placeholder="Big monthly stock-up"></div>';
  if(f.err)h+='<div class="banner">'+esc(f.err)+'</div>';
  h+='<div class="btnrow"><button class="btn" data-act="cancel">Cancel</button>'+
     '<button class="btn primary" data-act="save">'+(f.id?"Save changes":"Add haul")+'</button></div>';
  if(f.id)h+='<button class="btn danger" style="margin-top:8px" data-act="del" data-id="'+esc(f.id)+'">Delete this haul</button>';
  h+='</div></div>';
  return h;
}

/* ---------- actions ---------- */
function readForm(){
  var f=ui.form;
  f.title=(document.getElementById("i-title")||{}).value||"";
  f.amount=(document.getElementById("i-amount")||{}).value||"";
  f.date=(document.getElementById("i-date")||{}).value||f.date;
  f.cat=(document.getElementById("i-cat")||{}).value||f.cat;
  f.note=(document.getElementById("i-note")||{}).value||"";
}
function saveForm(){
  readForm();
  var f=ui.form, amt=parseAmt(f.amount);
  if(!isFinite(amt)||amt<=0){f.err="Enter an amount greater than 0.";render();return;}
  if(!f.date){f.err="Pick a date for this haul.";render();return;}
  var rec={id:f.id||uid(),date:f.date,who:f.who,title:(f.title||"").trim()||"Haul",
           amount:r2(amt),cat:f.cat,note:(f.note||"").trim()};
  var idx=-1;
  for(var i=0;i<S.entries.length;i++)if(S.entries[i].id===rec.id){idx=i;break;}
  if(idx>-1)S.entries[idx]=rec; else S.entries.push(rec);
  var pi=-1;
  for(i=0;i<pending.add.length;i++)if(pending.add[i].id===rec.id){pi=i;break;}
  if(pi>-1)pending.add[pi]=rec; else pending.add.push(rec);
  savePending();
  ui.month=mkey(rec.date);
  ui.form=null;
  commit({now:true});
}
function delEntry(id){
  S.entries=S.entries.filter(function(e){return e.id!==id;});
  if(S.deleted.indexOf(id)===-1)S.deleted.push(id);
  pending.add=pending.add.filter(function(e){return e.id!==id;});
  if(pending.del.indexOf(id)===-1)pending.del.push(id);
  savePending();
  ui.form=null;
  commit({now:true});
}
function csvText(){
  var rows=[["Date","Month","Store","Who paid","Category","Note","Amount"]];
  var es=S.entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  for(var i=0;i<es.length;i++){
    var e=es[i];
    rows.push([e.date,mkey(e.date),e.title,S.names[e.who]||e.who,e.cat||"",e.note||"",r2(e.amount).toFixed(2)]);
  }
  rows.push([]);
  var ms=allMonths().slice().reverse();
  rows.push(["Month","Period","Total",S.names.W+" paid",S.names.R+" paid",S.names.W+" share",S.names.R+" share","Owes","Amount"]);
  for(var j=0;j<ms.length;j++){
    var s=summarise(ms[j]);
    rows.push([mlabel(s.k),rangeLabel(s.k),s.total.toFixed(2),s.paid.W.toFixed(2),s.paid.R.toFixed(2),
               s.target.W.toFixed(2),s.target.R.toFixed(2),
               s.settle?S.names[s.settle.from]+" to "+S.names[s.settle.to]:"square",
               s.settle?s.settle.amount.toFixed(2):"0.00"]);
  }
  return rows.map(function(r){return r.map(function(c){
    c=String(c==null?"":c);
    return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;
  }).join(",");}).join("\n");
}
function b64enc(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64dec(str){
  str=str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length%4)str+="=";
  return decodeURIComponent(escape(atob(str)));
}
/* compact wire form: [id, date, who, title, amount, cat, note] */
function makeCode(scope){
  var list=S.entries;
  if(scope==="month")list=list.filter(function(e){return mkey(e.date)===ui.month;});
  if(!list.length)return null;
  var rows=list.map(function(e){
    return [e.id,e.date,e.who,e.title||"",r2(e.amount),e.cat||"",e.note||""];
  });
  return "TROLLEY1:"+b64enc(JSON.stringify({v:2,e:rows}));
}
function importCode(txt){
  txt=String(txt||"").trim();
  var i=txt.indexOf("TROLLEY1:");
  if(i<0)return {bad:true,msg:"That doesn’t look like a Trolley code — paste the whole thing, starting with TROLLEY1:"};
  var raw;
  try{ raw=JSON.parse(b64dec(txt.slice(i+9).replace(/[^A-Za-z0-9+/=_-]/g,""))); }
  catch(err){ return {bad:true,msg:"That code couldn’t be read — it may have been cut short. Ask for it again."}; }
  var list=Array.isArray(raw)?raw:(raw&&Array.isArray(raw.e)?raw.e:null);
  if(!list)return {bad:true,msg:"That code couldn’t be read."};
  var have={},n=0,dup=0,sum=0,dupSum=0,keys={},j;
  for(j=0;j<S.entries.length;j++)have[S.entries[j].id]=1;
  for(j=0;j<list.length;j++){
    var x=list[j],e;
    if(Array.isArray(x))e={id:x[0],date:x[1],who:x[2],title:x[3],amount:x[4],cat:x[5],note:x[6]};
    else e=x;
    if(!e||!e.id||!e.date)continue;
    keys[mkey(String(e.date))]=1;
    if(have[e.id]||S.deleted.indexOf(e.id)>-1){dup++;dupSum+=(+e.amount||0);continue;}
    var rec={id:String(e.id),date:String(e.date),who:e.who==="R"?"R":"W",
      title:String(e.title||"Haul"),amount:r2(+e.amount||0),
      cat:String(e.cat||"Other"),note:String(e.note||"")};
    S.entries.push(rec);have[rec.id]=1;n++;sum+=rec.amount;
    pending.add.push(rec);
  }
  savePending();
  if(n)saveMirror();
  var ks=Object.keys(keys).sort();
  var where=ks.length?(ks.length===1?" They’re in "+mlabel(ks[0])+".":" They span "+mlabel(ks[0])+" to "+mlabel(ks[ks.length-1])+"."):"";
  if(!ks.length)return {bad:true,msg:"No hauls found in that code."};
  if(!n)return {changed:false,keys:ks,
    msg:"Already had all "+dup+" of those hauls ("+money(dupSum)+")."+where+" Nothing to do."};
  return {changed:true,keys:ks,
    msg:n+" haul"+(n===1?"":"s")+" imported, "+money(sum)+" in total"+(dup?" ("+dup+" already had)":"")+"."+where};
}
function doImport(){
  var box=document.getElementById("f-imp");
  var v=(box&&box.value)||ui.imp||"";
  ui.codeOut=null;
  if(!v.replace(/\s/g,"")){
    ui.msg="Nothing in the box yet — paste the code and try again. It starts with TROLLEY1:";
    render();return;
  }
  var res=importCode(v);
  if(res.bad){ui.msg=res.msg;setImp(v);render();return;}
  /* Land the user where the hauls actually are, not on whatever period
     happened to be open — otherwise a good import looks like a failure. */
  setImp("");ui.msg="";ui.flash=res.msg;
  if(res.keys.length)ui.month=res.keys[res.keys.length-1];
  ui.tab="month";
  if(res.changed)commit({now:true});
  else render();
  window.scrollTo(0,0);
}
function shareCode(code){
  ui.codeOut=code;ui.codeKind="Hand-off code";
  try{localStorage.setItem(LS_SENT,today());}catch(e){}
  if(navigator.share){
    try{navigator.share({title:"Grocery hauls",text:code}).catch(function(){});}catch(e){}
  }
}
function saveCsvFile(name){
  var txt=csvText(), file=null;
  try{file=new File([txt],name,{type:"text/csv"});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(function(){
      ui.msg="Saved "+name+".";render();
    }).catch(function(err){
      if(err&&err.name==="AbortError")return;
      csvFallback(name,txt);
    });
    return;
  }
  csvFallback(name,txt);
}
function csvFallback(name,txt){
  try{
    var url=URL.createObjectURL(new Blob([txt],{type:"text/csv"}));
    var a=document.createElement("a");a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    ui.codeOut=null;ui.msg="Downloaded "+name+".";
  }catch(e){
    ui.codeOut=txt;ui.codeKind="CSV";ui.msg="Couldn’t save a file here — copy the CSV text instead.";
  }
  render();
}
function lastSent(){
  try{return localStorage.getItem(LS_SENT)||"";}catch(e){return "";}
}

/* ---------- events ---------- */
root.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el)return;
  var a=el.getAttribute("data-act");

  if(a==="dismiss"){ui.flash="";render();return;}
  if(a==="tab"){ui.tab=el.getAttribute("data-tab");ui.codeOut=null;ui.msg="";ui.flash="";ui.confirmWipe=false;render();return;}
  if(a==="mprev"){ui.month=shiftMonth(ui.month,-1);render();return;}
  if(a==="mnext"){ui.month=shiftMonth(ui.month,1);render();return;}
  if(a==="gomonth"){ui.month=el.getAttribute("data-month");ui.tab="month";render();window.scrollTo(0,0);return;}
  if(a==="open-form"){
    ui.form={id:null,title:"",amount:"",who:me,date:today(),cat:S.cats[0]||"Other",note:"",err:null};
    render();setTimeout(function(){var i=document.getElementById("i-title");if(i)i.focus();},30);return;
  }
  if(a==="edit"){
    var id=el.getAttribute("data-id"),e=null;
    for(var i=0;i<S.entries.length;i++)if(S.entries[i].id===id)e=S.entries[i];
    if(!e)return;
    ui.form={id:e.id,title:e.title,amount:r2(e.amount).toFixed(2),who:e.who,date:e.date,cat:e.cat||S.cats[0],note:e.note||"",err:null};
    render();return;
  }
  if(a==="who"){readForm();ui.form.who=el.getAttribute("data-who");render();return;}
  if(a==="quick"){readForm();ui.form.title=el.getAttribute("data-t");render();return;}
  if(a==="cancel"){ui.form=null;render();return;}
  if(a==="scrim"&&ev.target===el){ui.form=null;render();return;}
  if(a==="save"){saveForm();return;}
  if(a==="del"){delEntry(el.getAttribute("data-id"));return;}
  if(a==="me"){me=el.getAttribute("data-who");try{localStorage.setItem(LS_ME,me);}catch(err){}render();return;}
  if(a==="sendmonth"||a==="sendall"){
    var scope=a==="sendmonth"?"month":"all";
    var c=makeCode(scope);
    if(c){shareCode(c);ui.msg="";}
    else{ui.codeOut=null;ui.msg=scope==="month"?"No hauls logged for "+mlabel(ui.month)+" yet.":"No hauls logged yet.";}
    render();return;
  }
  if(a==="gosend"){ui.tab="setup";ui.codeOut=null;ui.msg="";render();window.scrollTo(0,0);return;}
  if(a==="copycode"){
    var out=document.getElementById("f-out");
    if(out){out.focus();out.select();try{document.execCommand("copy");}catch(err){}}
    if(navigator.clipboard&&ui.codeOut){try{navigator.clipboard.writeText(ui.codeOut);}catch(err){}}
    el.textContent="Copied";return;
  }
  if(a==="pasteimp"){
    if(!navigator.clipboard||!navigator.clipboard.readText){
      ui.msg="This browser won’t let the app read the clipboard — paste into the box by hand.";render();return;
    }
    navigator.clipboard.readText().then(function(t){
      setImp(t||"");doImport();
    }).catch(function(){
      ui.msg="Couldn’t read the clipboard — paste into the box by hand.";render();
    });
    return;
  }
  if(a==="import"){doImport();return;}
  if(a==="csv"){
    var name="grocery-split-"+mkey(today())+".csv";
    if(api&&api.download){
      api.download({filename:name,data:csvText()}).then(function(){
        ui.msg="Saved "+name+".";render();
      }).catch(function(err){
        if(err&&err.code==="declined")return;
        ui.codeOut=csvText();ui.codeKind="CSV";ui.msg="Couldn’t hand you a file here — copy the CSV text instead.";render();
      });
    }else{
      saveCsvFile(name);
    }
    return;
  }
  if(a==="wipe"){
    if(!ui.confirmWipe){ui.confirmWipe=true;render();
      setTimeout(function(){if(ui.confirmWipe){ui.confirmWipe=false;if(ui.tab==="setup")render();}},5000);return;}
    ui.confirmWipe=false;
    for(var k=0;k<S.entries.length;k++)S.deleted.push(S.entries[k].id);
    S.entries=[];S.settled={};pending={add:[],del:[]};savePending();
    ui.msg="All hauls erased.";
    commit({now:true});return;
  }
});
root.addEventListener("change",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el)return;
  var a=el.getAttribute("data-act");
  if(a==="settled"){S.settled[ui.month]=el.checked;if(!el.checked)delete S.settled[ui.month];commit();return;}
  if(a==="cycleday"){
    var d=parseInt(el.value,10);
    S.cycleDay=(d>=1&&d<=28)?d:1;
    ui.month=mkey(today());
    commit();return;
  }
  if(a==="budget"){var b=parseAmt(el.value);S.budget=isFinite(b)&&b>0?r2(b):0;commit();return;}
  if(a==="name"){var v=el.value.trim();if(v)S.names[el.getAttribute("data-who")]=v.slice(0,24);commit();return;}
  if(a==="cur"){S.cur=el.value.trim().slice(0,3)||"R";commit();return;}
  if(a==="cats"){
    var list=el.value.split("\n").map(function(x){return x.trim();}).filter(Boolean);
    S.cats=list.length?list.slice(0,20):["Groceries","Other"];commit();return;
  }
});
root.addEventListener("input",function(ev){
  if(ev.target&&ev.target.id==="f-imp"){setImp(ev.target.value);return;}
  var el=ev.target.closest("[data-act='split']");
  if(!el)return;
  S.splitW=Math.max(0,Math.min(100,parseInt(el.value,10)||0));
  var lw=root.querySelector(".splitview .s.W"), lr=root.querySelector(".splitview .s.R");
  if(lw)lw.textContent=S.splitW+"%";
  if(lr)lr.textContent=(100-S.splitW)+"%";
  if(mode==="local"){saveMirror();return;}
  clearTimeout(pubTimer);
  syncState="busy";paintSync();
  pubTimer=setTimeout(publishNow,1200);
});

/* ---------- boot ---------- */
window.__trolley={buildDoc:buildDoc,summarise:summarise,state:function(){return S;},render:render,ui:ui};
loadState();
try{
  var u=JSON.parse(sessionStorage.getItem(SS_UI)||"null");
  if(u&&u.tab){ui.tab=u.tab;ui.month=u.month;}
  sessionStorage.removeItem(SS_UI);
}catch(e){}
try{ui.imp=sessionStorage.getItem(SS_IMP)||"";}catch(e){}
render();

if(window.claude&&typeof window.claude.use==="function"){
  Promise.all([
    window.claude.use("artifact").catch(function(){return null;}),
    window.claude.use("downloads").catch(function(){return null;})
  ]).then(function(res){
    var art=res[0], dl=res[1];
    api={publish:art&&art.publish?function(h){return art.publish(h);}:null,
         download:dl&&dl.save?function(r){return dl.save(r);}:null};
    if(!api.publish){mode="local";syncState="local";}
    else{
      mode="writer";
      if(restored>0)ui.flash="Put back "+restored+" haul"+(restored===1?"":"s")+" this phone had but the page didn’t.";
      if(hasPending()||restored>0)commit({now:true});
      else syncState="idle";
    }
    render();
  });
}else{
  mode="local";syncState="local";render();
}
})();
